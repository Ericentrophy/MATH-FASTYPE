<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Rock – Number Challenges</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<section id="home">
  <header>
    <h1>Math<br>Rock</h1>
    <div class="stat"><span>Coins</span><b id="coins">0</b></div>
  </header>
  <div class="rank"><b id="rankName" class="big" style="font-size:1.2rem"></b><span id="rankNext" style="color:var(--mid)"></span></div>
  <div class="bar"><i id="rankBar"></i></div>

  <h2>Choose a challenge</h2>
  <div class="cards" id="cards"></div>

  <div id="tablesBox">
    <h2>Pick your tables</h2>
    <div class="chips" id="chips"></div>
  </div>

  <div class="modes">
    <button class="mode" id="gig"><b>Gig</b>60 seconds. Beat the clock on every question. Earn coins.</button>
    <button class="mode alt" id="practice"><b>Practice</b>12 questions with no timer. Wrong answers are shown.</button>
  </div>

  <h2>Times tables set list</h2>
  <div class="grid" id="grid"></div>
  <div class="legend"><span>New</span><span class="l">Tricky</span><span class="m">Getting there</span><span class="f">Fast</span></div>
</section>

<section id="game" class="hidden">
  <div class="top"><button class="quit" id="quit">Quit</button><b id="status"></b><b id="clock" class="big"></b></div>
  <div class="bar qbar"><i id="qbar"></i></div>
  <div class="q big" id="q"></div>
  <div class="ans" id="ans" aria-live="polite"></div>
  <div class="pad" id="pad"></div>
</section>

<section id="end" class="hidden">
  <h2 style="text-align:center;margin-top:30px" id="endTitle"></h2>
  <div class="score big" id="endScore"></div>
  <p class="sum" id="endSum"></p>
  <div id="endFix"></div>
  <div class="modes">
    <button class="mode" id="again"><b>Play again</b>Same challenge</button>
    <button class="mode alt" id="home2"><b>Home</b>Change challenge</button>
  </div>
</section>
</main>

<script src="script.js"></script>
</body>
</html>
